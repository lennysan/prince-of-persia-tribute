<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prince of Persia (fan tribute)</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;}
  canvas{image-rendering:pixelated;background:#000;display:block;
         box-shadow:0 0 80px rgba(60,50,120,.35);}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="640" height="440"></canvas></div>
<script>
"use strict";
/* ============================================================
   PRINCE OF THE DUNGEON
   An original tribute to the classic 1989 dungeon platformer.
   All code & art generated procedurally. Arrow keys + Shift.
   ============================================================ */

const cv = document.getElementById('cv');
const screen = cv.getContext('2d');
// draw full-res -> decimate to 320x220 (like the 320x200 original) -> upscale, all nearest-neighbor
const hi = document.createElement('canvas'); hi.width=640; hi.height=440;
const ctx = hi.getContext('2d');
const lo = document.createElement('canvas'); lo.width=320; lo.height=220;
const loctx = lo.getContext('2d');

// ---------- constants ----------
const TW=64, TH=128;            // tile size
const ROOM_W=10, ROOM_H=3;      // tiles per screen
const VIEW_W=ROOM_W*TW;         // 640
const VIEW_H=ROOM_H*TH;         // 384
const HUD_H=56;
const MAP_W=50, MAP_H=9;
const GRAV=0.55;
const RUN_SPD=4.2, WALK_SPD=1.4, STEP_SPD=1.8;
const FPS=60, DT=1000/FPS;

// fall thresholds (px)
const FALL_SAFE=470, FALL_HURT=800;

// ---------- map ----------
// ' ' empty | '#' wall | '-' floor | '~' loose | '^' spikes
// 'P','Q' timed plates | 'R' permanent plate | 'A','B' gates
// entities: '*' start 'S' sword 'H' potion 'E' exit 'g' guard 'k' bones
const grid=[];
for(let r=0;r<MAP_H;r++){grid.push(new Array(MAP_W).fill(' '));}
function put(r,c,ch){grid[r][c]=ch;}
function span(r,c0,c1,ch){for(let c=c0;c<=c1;c++)grid[r][c]=ch;}
// outer walls
for(let r=0;r<MAP_H;r++){put(r,0,'#');put(r,49,'#');}
// --- top band: starting cell ---
for(let r=0;r<=2;r++)put(r,9,'#');
span(2,1,8,'-'); put(2,3,'P'); put(2,7,'~'); put(2,8,'~');
put(1,2,'*'); put(1,5,'A');
// --- middle band ---
span(5,1,16,'-'); put(5,12,'^'); put(5,13,'^');
span(5,19,30,'-'); put(5,26,'Q');
put(4,22,'-'); put(4,23,'-'); put(3,23,'H');
put(4,28,'B');
span(5,44,48,'-'); put(4,47,'E');
// --- bottom band ---
for(let r=6;r<=8;r++)put(r,15,'#');
span(8,16,43,'-'); put(8,27,'^'); put(8,28,'^'); put(8,40,'R');
put(7,17,'H'); put(7,18,'k'); put(7,24,'S'); put(7,36,'g');
put(7,42,'-'); put(6,43,'-');
for(let r=6;r<=8;r++)span(r,44,48,'#');

// torches (r,c)
const torches=[[1,1],[1,7],[4,3],[4,9],[4,20],[4,30],[4,45],[7,21],[7,33],[7,39]];

const FLOORY = new Set(['-','~','^','P','Q','R','#']);
function tile(r,c){ if(r<0||r>=MAP_H||c<0||c>=MAP_W) return '#'; return grid[r][c]; }
function isFloor(r,c){ return FLOORY.has(tile(r,c)); }
function isSolidCell(r,c){ // blocks horizontal movement
  const t=tile(r,c);
  if(t==='#') return true;
  if(t==='A'||t==='B'){ const g=gates[t]; return g.open<0.7; }
  return false;
}

// ---------- level state ----------
let gates, looses, plates, items, guard, P, msg, msgT, debris=[];
let timeLeft, gameState, winT, deadReason, shake=0;

function freshLevel(keepSword){
  const hadSword = keepSword && P && P.hasSword;
  gates = { A:{r:1,c:5,open:0,timer:0,perm:false},
            B:{r:4,c:28,open:0,timer:0,perm:false},
            E:{r:4,c:47,open:0,timer:0,perm:true} };
  plates = [ {r:2,c:3,gate:'A',down:0}, {r:5,c:26,gate:'B',down:0},
             {r:8,c:40,gate:'E',down:0} ];
  looses = [ {r:2,c:7,t:-1,gone:false}, {r:2,c:8,t:-1,gone:false} ];
  items  = [ {type:'potion',r:3,c:23,taken:false},
             {type:'potion',r:7,c:17,taken:false},
             {type:'sword', r:7,c:24,taken:hadSword} ];
  guard  = { x:36*TW+32, y:8*TH, vx:0, hp:3, alive:true, face:-1,
             state:'idle', t:0, cd:90, post:36*TW+32,
             zone:[33*TW+10, 43.6*TW], stagger:0, strikeT:0, alerted:false };
  P = { x:2*TW+32, y:2*TH, vx:0, vy:0, face:1, hp:3, maxhp:3,
        mode:'ground', anim:'stand', ph:0, fallFrom:2*TH,
        hasSword:hadSword, drawn:false, climb:null, hang:null, coyote:0, lastStep:-1, pendJump:null,
        act:null, actT:0, parryT:0, strikeT:0, iframes:0, dead:false };
  debris=[]; msg=''; msgT=0;
}

function startGame(){
  freshLevel(false);
  timeLeft=60*60*1000;
  gameState='play';
  say('Escape the dungeon before the hour runs out!',300);
}

function say(s,t){ msg=s; msgT=t||180; }

// ---------- input ----------
const keys={};
let upBuf=0, shiftBuf=0, dnBuf=0;
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  const k=norm(e.key);
  if(!keys[k]){ if(k==='up')upBuf=14; if(k==='shift')shiftBuf=10; if(k==='down')dnBuf=10; }
  keys[k]=true;
  audio.unlock();
  if(gameState==='title'&&(k==='enter'||k===' ')) startGame();
  else if(gameState==='dead'&&k==='r'){ freshLevel(true); gameState='play'; }
  else if((gameState==='over'||gameState==='win')&&k==='r'){ gameState='title'; }
});
addEventListener('keyup',e=>{ keys[norm(e.key)]=false; });
function norm(k){
  k=k.toLowerCase();
  if(k==='arrowup'||k==='w')return 'up';
  if(k==='arrowdown'||k==='s')return 'down';
  if(k==='arrowleft'||k==='a')return 'left';
  if(k==='arrowright'||k==='d')return 'right';
  return k;
}

// ---------- audio: synth + sequencer ----------
const audio={ ac:null, master:null, cur:null, loopTimer:null,
  unlock(){ if(!this.ac){ try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
            if(this.ac&&this.ac.state==='suspended')this.ac.resume(); },
  bus(){ // master + cavernous echo
    if(!this.ac)return null;
    if(!this.master){
      const ac=this.ac;
      this.master=ac.createGain(); this.master.gain.value=0.9;
      this.master.connect(ac.destination);
      const wet=ac.createGain(); wet.gain.value=0.22;
      const dl=ac.createDelay(1); dl.delayTime.value=0.17;
      const fb=ac.createGain(); fb.gain.value=0.3;
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600;
      this.master.connect(wet); wet.connect(dl); dl.connect(lp);
      lp.connect(ac.destination); lp.connect(fb); fb.connect(dl);
    }
    return this.master;
  },
  env(g,t0,a,d,v){ g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+a);
                   g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); },
  sched(f,t0,dur,type,vol,slide){ if(!this.ac)return;
    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    this.env(g,t0,0.01,dur,vol||0.15); o.connect(g);g.connect(this.bus());
    o.start(t0);o.stop(t0+dur+0.15); },
  tone(f,dur,type,vol,slide){ if(!this.ac)return; this.sched(f,this.ac.currentTime,dur,type,vol,slide); },
  noise(dur,vol,fc,hp){ if(!this.ac)return; const t=this.ac.currentTime;
    const n=Math.max(16,this.ac.sampleRate*dur), b=this.ac.createBuffer(1,n,this.ac.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=this.ac.createBufferSource(); s.buffer=b;
    const f=this.ac.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=fc||800;
    const g=this.ac.createGain(); this.env(g,t,0.005,dur,vol||0.1);
    s.connect(f);f.connect(g);g.connect(this.bus()); s.start(t); },
  // ---- melodies (original compositions, double-harmonic scale) ----
  fq(m){ return 440*Math.pow(2,(m-69)/12); },
  tune(seq,mpb,type,vol,delayBeats){ if(!this.ac)return 0;
    let t=this.ac.currentTime+0.05+(delayBeats||0)*mpb/1000;
    let total=(delayBeats||0)*mpb;
    for(const[m,b]of seq){ if(m!==null)this.sched(this.fq(m),t,b*mpb/1000*0.92,type,vol);
      t+=b*mpb/1000; total+=b*mpb; }
    return total; },
  titleTune(){
    const mel=[[57,1.5],[58,.5],[61,1],[62,1],[64,2],[65,1],[64,1],[62,1],[61,1],[58,1],[57,2],[null,1],
               [64,1.5],[65,.5],[68,1],[69,1],[68,1],[65,1],[64,2],[62,1],[61,1],[58,1.5],[57,3],[null,2]];
    const bass=[[45,8],[45,6],[44,2],[45,8],[40,4],[45,6]];
    this.tune(bass,300,'triangle',0.08);
    return this.tune(mel,300,'square',0.055); },
  ensure(state){ // music state machine
    if(!this.ac){ this.cur=null; return; }
    if(state===this.cur)return;
    if(this.loopTimer){ clearTimeout(this.loopTimer); this.loopTimer=null; }
    this.cur=state;
    if(state==='title'){
      const loop=()=>{ if(this.cur!=='title')return;
        const d=this.titleTune(); this.loopTimer=setTimeout(loop,d+900); };
      loop();
    } else if(state==='play'){
      this.tune([[57,.4],[61,.4],[64,.4],[69,1.4]],260,'square',0.06);
    } else if(state==='dead'){
      this.tune([[62,.6],[61,.6],[58,.6],[57,2.2]],330,'square',0.06,1.5);
    } else if(state==='over'){
      this.tune([[57,1],[52,1],[50,1],[45,3.5]],400,'square',0.07);
    } // 'win' fanfare fired by audio.win()
  },
  // ---- sfx ----
  step(alt){ this.noise(0.045,0.05,alt?700:500); },
  jump(){ this.noise(0.18,0.07,1400); },
  land(){ this.tone(80,0.12,'sine',0.2,50); this.noise(0.08,0.08,300); },
  thud(){ this.tone(60,0.25,'sine',0.3,35); this.noise(0.15,0.15,200); },
  hurt(){ this.tone(220,0.2,'sawtooth',0.15,90); this.noise(0.1,0.08,900); },
  die(){ this.tone(300,0.7,'sawtooth',0.18,40); },
  clang(){ this.tone(820,0.18,'square',0.1); this.tone(1244,0.26,'square',0.06);
           this.tone(2630,0.12,'sine',0.05); this.noise(0.05,0.12,3500,true); },
  slash(){ this.noise(0.14,0.1,2800,true); },
  pickup(){ this.tone(660,0.1,'sine',0.15); this.tone(2200,0.3,'sine',0.04);
            setTimeout(()=>this.tone(880,0.2,'sine',0.15),100); },
  drink(){ [300,380,460].forEach((f,i)=>setTimeout(()=>this.tone(f,0.08,'sine',0.12,f*1.6),i*100)); },
  gate(){ this.noise(0.6,0.13,140); this.tone(55,0.5,'sawtooth',0.05,40); },
  plate(){ this.tone(140,0.08,'square',0.08); this.noise(0.04,0.06,600); },
  crumble(){ this.noise(0.4,0.18,400); this.tone(90,0.3,'sine',0.1,45); },
  crackle(){ this.noise(0.06,0.025,2400,true); },
  win(){ this.tune([[57,.5],[61,.5],[64,.5],[69,1],[68,.5],[69,.75],[71,.75],[73,2.5]],260,'triangle',0.09);
         this.tune([[45,2],[45,2],[49,3]],260,'triangle',0.07); }
};

// ---------- helpers ----------
function feetRow(y){ return Math.round(y/TH); }
function colOf(x){ return Math.floor(x/TW); }
function supports(r,c){ // can stand on top of this cell
  return isFloor(r,c) && tile(r-1,c)!=='#';
}
function standingOn(){ // tile (r,c) under feet, or null
  const r=feetRow(P.y);
  if(Math.abs(P.y - r*TH)>2) return null;
  const c=colOf(P.x);
  if(supports(r,c)) return {r,c};
  // allow slight overhang
  const c2=colOf(P.x+(P.x-c*TW>32?13:-13));
  if(supports(r,c2)) return {r,c:c2};
  return null;
}

// ---------- player update ----------
function updatePlayer(){
  if(P.dead) return;
  if(P.iframes>0)P.iframes--;
  if(P.parryT>0)P.parryT--;
  if(P.strikeT>0)P.strikeT--;
  if(upBuf>0)upBuf--; if(shiftBuf>0)shiftBuf--; if(dnBuf>0)dnBuf--;

  // timed action overlay (pickup / drink)
  if(P.act){
    P.actT--;
    if(P.actT<=0){
      if(P.act==='pickup'){ P.hasSword=true; say('You found a sword!',200); audio.pickup(); }
      if(P.act==='drink'){ P.hp=Math.min(P.maxhp,P.hp+1); say('The potion restores your strength.',180); audio.drink(); }
      P.act=null;
    }
    return;
  }

  // ----- climbing script -----
  if(P.mode==='climb'){
    const c=P.climb; c.t+=1/36;
    if(c.t>=1){ P.x=c.tx; P.y=c.ty; P.mode='ground'; P.vy=0; P.fallFrom=P.y; }
    else { const e=c.t*c.t*(3-2*c.t);
           P.x=c.fx+(c.tx-c.fx)*e; P.y=c.fy+(c.ty-c.fy)*e; }
    return;
  }

  // ----- hanging -----
  if(P.mode==='hang'){
    if(upBuf>0||keys.up&&P.hang.grace<=0){ // climb up
      upBuf=0;
      startClimb(P.hang.r,P.hang.c);
      return;
    }
    P.hang.grace--;
    if(dnBuf>0||(!keys.shift&&P.hang.grace<-20&&!keys.up)){
      dnBuf=0; P.mode='air'; P.vy=0; P.fallFrom=P.y; P.hang=null;
    }
    return;
  }

  const inCombat = combatActive();

  // ----- ground -----
  if(P.mode==='ground'){
    const on=standingOn();
    if(!on){ P.mode='air'; P.vy=0; P.fallFrom=P.y; }
    else{
      // loose floor trigger
      triggerLoose(on.r,on.c);
      // spikes: deadly if arrived fast (handled on entry below)
      let dir=0;
      if(keys.left)dir=-1; else if(keys.right)dir=1;
      if(dir!==0 && !inCombat) P.face=dir;
      if(inCombat){
        // combat footwork
        P.face = guard.x>P.x?1:-1;
        let mv=0;
        if(keys.left)mv=-STEP_SPD; if(keys.right)mv=STEP_SPD;
        tryMove(mv);
        P.anim='stance';
        if(shiftBuf>0&&P.strikeT<=0){ shiftBuf=0; P.strikeT=26; audio.slash(); }
        if(upBuf>0){ upBuf=0; P.parryT=20; }
        if(P.strikeT===14) resolvePlayerStrike();
        if(P.strikeT>0)P.anim='strike';
        else if(P.parryT>0)P.anim='parry';
      } else {
        const careful=keys.shift;
        let spd = dir===0?0:(careful?WALK_SPD:RUN_SPD);
        // crouch
        if(keys.down&&dir===0){
          P.anim='crouch';
          if(!tryPickup()) tryClimbDown();
        } else if(dir!==0){
          // jump assist: leap queued for the edge of the pit ahead
          if(P.pendJump!==null){
            if(careful||Math.sign(P.pendJump-P.x)!==dir&&Math.abs(P.pendJump-P.x)>8) P.pendJump=null;
            else if(dir>0 ? P.x+spd>=P.pendJump : P.x-spd<=P.pendJump){
              P.x=P.pendJump; P.face=dir; doRunJump(dir); return;
            }
          }
          const moved=tryMove(dir*spd);
          P.anim = careful?'walk':'run';
          P.ph+=Math.abs(spd)*0.012;
          const si=Math.floor(P.ph*2);
          if(moved&&!careful&&si!==P.lastStep){ P.lastStep=si; audio.step(si%2); }
          // run off edge?
          const on2=standingOn();
          if(!on2){
            if(careful){ // careful walk stops at edge... but allow hang via down
              stepBackToEdge();
            } else { P.mode='air'; P.vy=0; P.vx=dir*spd*0.55; P.fallFrom=P.y; P.anim='fall';
                     P.coyote=10; }
          } else {
            // walked onto spikes at speed?
            if(tile(on2.r,on2.c)==='^'&&!careful&&Math.abs(spd)>2){ killP('impaled'); return; }
          }
        } else P.anim='stand';
        // jumps (only if still grounded — edge run-offs are handled by coyote time)
        if(upBuf>0&&P.mode==='ground'){
          upBuf=0;
          if(tryClimbUp()) return;
          if(dir!==0){ // running / standing leap
            const running=Math.abs(spd)>3;
            if(running){
              const tx=jumpTakeoff(dir);
              if(tx!==null){ P.pendJump=tx; } // defer to the pit edge
              else doRunJump(dir);
            } else {
              P.vy=-7; P.vx=dir*3.4;
              P.mode='air'; P.anim='leap'; P.fallFrom=P.y-1; audio.jump();
            }
          } else { // vertical jump (and grab attempt)
            P.vy=-9; P.vx=0; P.mode='air'; P.anim='jumpup'; P.fallFrom=P.y-1; audio.jump();
          }
        }
      }
    }
  }

  // ----- air -----
  if(P.mode==='air'){
    // coyote time: jump still works just after running off an edge
    // (also fires a queued jump-assist leap that didn't trigger before the edge)
    if(P.coyote>0){
      P.coyote--;
      if(upBuf>0||P.pendJump!==null){
        upBuf=0; P.coyote=0; P.pendJump=null;
        P.vy=-9; P.vx=P.face*5.8; P.anim='leap'; audio.jump();
      }
    } else P.pendJump=null;
    P.vy+=GRAV;
    if(P.vy>16)P.vy=16;
    P.fallFrom=Math.min(P.fallFrom,P.y);
    tryMove(P.vx);
    // ceiling
    if(P.vy<0){
      const hr=Math.floor((P.y-95)/TH), hc=colOf(P.x);
      if(isFloor(hr,hc)&&(P.y-95)<(hr+1)*TH&&(P.y-95)>(hr+1)*TH-20){ P.vy=0; }
    }
    if((keys.shift||keys.up)&&tryGrab()) return;
    const ny=P.y+P.vy;
    if(P.vy>0){
      // landing
      const r0=Math.floor(P.y/TH-0.001)+1;
      for(let r=r0;r*TH<=ny;r++){
        const c=colOf(P.x);
        let lc=null;
        if(supports(r,c))lc=c;
        else{ const c2=colOf(P.x+(P.x-c*TW>32?13:-13)); if(supports(r,c2))lc=c2; }
        if(lc!==null){
          P.y=r*TH; P.vy=0; P.mode='ground';
          land(r,lc); return;
        }
      }
    }
    P.y=ny;
    if(P.vy>2)P.anim='fall';
    if(P.y>MAP_H*TH+200) killP('fell into darkness');
  }

  // exit check
  const E=gates.E;
  if(gates.E.open>0.8 && Math.abs(P.x-(E.c*TW+32))<22 && Math.abs(P.y-5*TH)<8 && P.mode==='ground'){
    gameState='win'; winT=0; audio.win();
  }
}

function land(r,c){
  const fall=P.y-P.fallFrom;
  P.vx=0;
  const t=tile(r,c);
  if(t==='^'){ killP('impaled'); return; }
  if(fall>=FALL_HURT){ killP('crushed by the fall'); return; }
  if(fall>=FALL_SAFE){ P.hp--; audio.thud(); shake=10; say('A hard landing...',120);
    if(P.hp<=0){ killP('crushed by the fall'); return; } }
  else if(fall>120) audio.land();
  triggerLoose(r,c);
  P.fallFrom=P.y;
}

function doRunJump(dir){
  P.vy=-9; P.vx=dir*5.8; P.mode='air'; P.anim='leap'; P.fallFrom=P.y-1;
  P.pendJump=null; audio.jump();
}
function jumpTakeoff(dir){
  // if spikes or a gap lie just ahead, return the ideal takeoff x at the edge
  const r=feetRow(P.y);
  let c=colOf(P.x);
  if(!isFloor(r,c)){ // overhanging the edge: measure from the supporting column
    const c2=colOf(P.x+(P.x-c*TW>32?13:-13));
    if(isFloor(r,c2))c=c2; else return null; // already past it — jump now
  }
  for(let i=1;i<=3;i++){
    const hc=c+i*dir, t=tile(r,hc);
    const hazard = t==='^' || !isFloor(r,hc);
    if(t==='#')return null;
    if(hazard){
      const x = dir>0 ? hc*TW-15 : (hc+1)*TW+15;
      return (dir>0 ? x>P.x+6 : x<P.x-6) ? x : null;
    }
  }
  return null;
}
function tryMove(dx){
  if(dx===0)return false;
  const nx=P.x+dx;
  const dir=Math.sign(dx);
  // guard blocks the way
  if(guard.alive&&Math.abs(guard.y-P.y)<70){
    const gd=guard.x-P.x;
    if(Math.sign(gd)===dir&&Math.abs(guard.x-nx)<38&&Math.abs(gd)>=Math.abs(guard.x-nx)){
      P.x=guard.x-dir*38; if(P.mode==='air')P.vx=0; return false;
    }
  }
  const edge=nx+dir*13;
  const c=Math.floor(edge/TW);
  // body occupies rows from feet-100 .. feet-5
  const r1=Math.floor((P.y-95)/TH), r2=Math.floor((P.y-10)/TH);
  for(let r=r1;r<=r2;r++){
    if(isSolidCell(r,c)){ P.x=c*TW+(dir>0?-14:TW+14); if(P.mode==='air')P.vx=0; return false; }
  }
  P.x=nx; return true;
}

function stepBackToEdge(){
  // careful walk: keep feet on last floor pixel
  const r=feetRow(P.y), c=colOf(P.x);
  if(!isFloor(r,c)){
    const cc=colOf(P.x-P.face*16);
    P.x = P.face>0 ? cc*TW+TW-15 : cc*TW+15;
  }
}

function tryClimbUp(){
  // ledge directly ahead one tile up
  const r=feetRow(P.y)-1;
  for(const c of [colOf(P.x+P.face*40), colOf(P.x+P.face*20)]){
    if(supports(r,c)&&!isFloor(r-1,c)&&!isSolidCell(r-1,c)){
      startClimb(r,c); return true;
    }
  }
  return false;
}

function startClimb(r,c){
  P.mode='climb'; P.anim='climb'; P.hang=null;
  P.climb={fx:P.x,fy:P.y,tx:c*TW+32,ty:r*TH,t:0};
  P.face = (c*TW+32)>P.x?1:-1;
}

function tryClimbDown(){
  // at an edge: hang from current floor
  if(dnBuf<=0)return;
  const r=feetRow(P.y), cHere=colOf(P.x);
  const cF=colOf(P.x+P.face*40);
  if(!isFloor(r,cF)&&isFloor(r,cHere)){
    dnBuf=0;
    P.x=cHere*TW+(P.face>0?TW-6:6);
    P.x+=P.face*12;
    P.face=-P.face;
    P.mode='hang'; P.anim='hang';
    P.hang={r:r,c:cHere,grace:14};
    P.y=r*TH+90;
  }
}

function tryGrab(){
  // mid-air: grab a ledge near the hands (reach ~100px above feet)
  const supCols=[colOf(P.x),colOf(P.x+13),colOf(P.x-13)];
  const r0=Math.floor((P.y-100)/TH), r1=Math.floor(P.y/TH)+1;
  for(let rr=r0;rr<=r1;rr++){
    const ly=rr*TH;
    if(ly<P.y-100||ly>P.y+Math.max(P.vy,0)+46)continue;
    for(const c of [colOf(P.x+P.face*30), colOf(P.x+P.face*16)]){
      if(supCols.includes(c))continue;          // would just land there
      if(supports(rr,c)&&!isFloor(rr-1,c)&&!isSolidCell(rr-1,c)){
        P.mode='hang'; P.anim='hang'; P.vy=0; P.vx=0;
        P.hang={r:rr,c:c,grace:14};
        P.y=rr*TH+90;
        P.x=c*TW+32-P.face*38;
        audio.land();
        return true;
      }
    }
  }
  return false;
}

function killP(reason){
  if(P.dead)return;
  P.dead=true; P.anim='dead'; deadReason=reason;
  gameState='dead'; audio.die(); shake=14;
}

function tryPickup(){
  for(const it of items){
    if(it.taken)continue;
    const ix=it.c*TW+32, iy=(it.r+1)*TH;
    if(Math.abs(P.x-ix)<34&&Math.abs(P.y-iy)<10){
      it.taken=true;
      if(it.type==='sword'){ P.act='pickup'; P.actT=40; }
      else { P.act='drink'; P.actT=50; }
      return true;
    }
  }
  return false;
}

// ---------- loose floors ----------
function triggerLoose(r,c){
  for(const L of looses){
    if(L.gone||L.t>=0)continue;
    if(L.r===r&&L.c===c){ L.t=26; }
  }
}
function updateLooses(){
  for(const L of looses){
    if(L.gone)continue;
    if(L.t>0)L.t--;
    else if(L.t===0){
      L.gone=true; grid[L.r][L.c]=' ';
      audio.crumble();
      debris.push({x:L.c*TW,y:L.r*TH,vy:1,r:L.r,c:L.c,life:200});
    }
  }
  for(const d of debris){
    if(d.life<=0)continue;
    d.vy+=GRAV; d.y+=d.vy;
    const rr=Math.floor((d.y+18)/TH);
    if(isFloor(rr,d.c)&&d.y+18>=rr*TH){ d.y=rr*TH-18; d.vy=0; d.life--; if(d.life===199)audio.thud(); d.life=Math.min(d.life,120); d.life--; }
    if(d.y>MAP_H*TH+100)d.life=0;
  }
}

// ---------- plates & gates ----------
function updatePlates(){
  for(const pl of plates){
    let pressed=false;
    if(P.mode==='ground'&&!P.dead&&feetRow(P.y)===pl.r&&colOf(P.x)===pl.c)pressed=true;
    if(guard.alive&&Math.round(guard.y/TH)===pl.r&&colOf(guard.x)===pl.c)pressed=true;
    if(pressed&&pl.down<1){ if(pl.down===0)audio.plate(); pl.down=1;
      const g=gates[pl.gate]; g.timer=g.perm?1e9:360; }
    if(!pressed)pl.down=Math.max(0,pl.down-0.2);
  }
  for(const k in gates){
    const g=gates[k];
    if(g.timer>0){ g.timer--;
      if(g.open<1){ g.open=Math.min(1,g.open+0.022); if(g.open<0.1)audio.gate(); } }
    else if(g.open>0&&!g.perm){ g.open=Math.max(0,g.open-0.008); }
  }
}

// ---------- guard & combat ----------
function combatActive(){
  return P.hasSword&&guard.alive&&guard.alerted&&Math.abs(guard.x-P.x)<380&&Math.abs(guard.y-P.y)<140;
}
function updateGuard(){
  if(!guard.alive)return;
  const dy=Math.abs(guard.y-P.y), dx=guard.x-P.x, adx=Math.abs(dx);
  // alert
  if(!guard.alerted && dy<140 && adx<340 && !P.dead){
    guard.alerted=true; say('En garde!',120); audio.slash();
  }
  if(guard.stagger>0){ guard.stagger--; return; }
  if(P.dead||dy>200){ // return to post
    guard.alerted=false;
    if(Math.abs(guard.x-guard.post)>4)guard.x+=Math.sign(guard.post-guard.x)*1.5;
    return;
  }
  if(!guard.alerted)return;
  guard.face = dx>0?-1:1;
  // movement
  const want=110;
  if(guard.strikeT>0){
    guard.strikeT--;
    if(guard.strikeT===10){ // strike lands
      if(adx<130&&dy<130&&P.iframes<=0&&!P.dead){
        if(P.parryT>0){ audio.clang(); guard.stagger=55; say('Parried!',60); }
        else { P.hp--; P.iframes=40; audio.hurt(); shake=6;
               P.x-=Math.sign(dx)*-18;
               if(P.hp<=0)killP('slain by the guard'); }
      }
    }
    return;
  }
  if(adx>want+15){ const nx=guard.x-Math.sign(dx)*(P.hasSword?1.6:2.3);
    if(nx>guard.zone[0]&&nx<guard.zone[1])guard.x=nx; }
  else if(adx<70){ const nx=guard.x+Math.sign(dx)*1.6;
    if(nx>guard.zone[0]&&nx<guard.zone[1])guard.x=nx; }
  // attack
  if(guard.cd>0)guard.cd--;
  else if(adx<150&&dy<130){ guard.strikeT=32; guard.cd=70+Math.random()*70; }
}
function resolvePlayerStrike(){
  if(!guard.alive)return;
  const adx=Math.abs(guard.x-P.x), dy=Math.abs(guard.y-P.y);
  if(adx<130&&dy<130){
    if(Math.random()<0.32&&guard.stagger<=0&&guard.strikeT<=0){ audio.clang(); say('Blocked!',50); }
    else{
      guard.hp--; guard.stagger=40; guard.x+=Math.sign(guard.x-P.x)*20; audio.hurt();
      if(guard.hp<=0){ guard.alive=false; say('The guard falls.',180); audio.thud(); }
    }
  }
}

// ---------- spike extension ----------
function spikeExt(r,c){
  const d=Math.hypot(P.x-(c*TW+32),P.y-(r*TH));
  return d<160?1:Math.max(0,1-(d-160)/120);
}

// ---------- main loop ----------
let last=performance.now(), acc=0;
function loop(now){
  acc+=now-last; last=now;
  if(acc>200)acc=200;
  while(acc>=DT){ tick(); acc-=DT; }
  audio.ensure(gameState);
  if(gameState==='play'&&Math.random()<0.005)audio.crackle();
  render();
  requestAnimationFrame(loop);
}
function tick(){
  if(gameState==='play'){
    timeLeft-=DT;
    if(timeLeft<=0){ timeLeft=0; gameState='over'; }
    updatePlayer(); updateGuard(); updatePlates(); updateLooses();
    if(msgT>0)msgT--;
  } else if(gameState==='dead'){
    updateLooses(); if(msgT>0)msgT--;
    timeLeft-=DT; if(timeLeft<=0){timeLeft=0;gameState='over';}
  } else if(gameState==='win'){ winT++; }
  if(shake>0)shake--;
}

// ---------- rendering ----------
function hash(r,c,s){ let h=(r*73856093)^(c*19349663)^(s*83492791); h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }

function render(){
  renderScene();
  screen.imageSmoothingEnabled=false;
  if(gameState==='title'){ // title art at full res so the lettering stays readable
    screen.drawImage(hi,0,0,cv.width,cv.height);
    return;
  }
  loctx.imageSmoothingEnabled=false;
  loctx.drawImage(hi,0,0,lo.width,lo.height);
  screen.drawImage(lo,0,0,cv.width,cv.height);
}
function renderScene(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  if(gameState==='title'){ drawTitle(); return; }
  // camera (room flip)
  const cx=Math.max(0,Math.min(4,Math.floor(P.x/VIEW_W)));
  const cy=Math.max(0,Math.min(2,Math.floor((P.y-50)/VIEW_H)));
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake*0.6);
  ctx.translate(-cx*VIEW_W,-cy*VIEW_H);
  const r0=cy*ROOM_H, c0=cx*ROOM_W;
  drawRoom(r0,c0);
  drawItems(r0,c0);
  drawDebris();
  if(guard.x>c0*TW-80&&guard.x<(c0+10)*TW+80&&guard.y>r0*TH-40&&guard.y<(r0+3)*TH+140) drawGuard();
  drawPrince();
  drawGatesFront(r0,c0);
  ctx.restore();
  drawHUD();
  if(gameState==='dead')drawDeath();
  if(gameState==='over')drawGameOver();
  if(gameState==='win')drawWin();
}

// ----- environment -----
function drawRoom(r0,c0){
  for(let r=r0;r<r0+3;r++)for(let c=c0;c<c0+10;c++){
    const t=tile(r,c);
    const x=c*TW,y=r*TH;
    if(t==='#')drawWall(x,y,r,c);
  }
  // torches behind floors
  for(const[tr,tc]of torches){
    if(tr>=r0&&tr<r0+3&&tc>=c0&&tc<c0+10)drawTorch(tc*TW+32,tr*TH+TH-38);
  }
  for(let r=r0;r<r0+3;r++)for(let c=c0;c<c0+10;c++){
    const t=tile(r,c);
    const x=c*TW,y=r*TH;
    if(t==='-'||t==='~'||t==='^'||t==='P'||t==='Q'||t==='R'){
      let jx=0;
      if(t==='~'){const L=looses.find(l=>l.r===r&&l.c===c);
        if(L&&L.t>0)jx=Math.sin(L.t*1.7)*2.5;}
      drawSlab(x+jx,y,r,c,t);
      if(t==='^')drawSpikes(x,y,spikeExt(r,c));
      if(t==='P'||t==='Q'||t==='R'){
        const pl=plates.find(p=>p.r===r&&p.c===c);
        drawPlate(x,y,pl?pl.down:0);
      }
      if(t==='~')drawCracks(x+jx,y);
    }
  }
  // skeleton & exit door
  if(tile(7,18)==='k'&&r0===6&&c0<=18&&c0+10>18)drawBones(18*TW+32,8*TH);
  const E=gates.E;
  if(E.r>=r0&&E.r<r0+3&&E.c>=c0&&E.c<c0+10)drawExit(E.c*TW+32,5*TH,E.open);
}

function drawWall(x,y,r,c){
  ctx.fillStyle='#3a3450'; ctx.fillRect(x,y,TW,TH);
  ctx.strokeStyle='#241f33'; ctx.lineWidth=2;
  for(let i=0;i<4;i++){
    const by=y+i*32;
    ctx.strokeRect(x+( (r*4+i)%2 ? -16:0 )+0.5,by+0.5,TW,32);
  }
  ctx.fillStyle='rgba(255,255,255,0.04)';
  for(let i=0;i<3;i++){
    const rx=hash(r,c,i)*TW, ry=hash(c,r,i+9)*TH;
    ctx.fillRect(x+rx,y+ry,10,4);
  }
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x,y+TH-6,TW,6);
}

function drawSlab(x,y,r,c,t){
  // floor surface at top of cell
  ctx.fillStyle='#6b6280'; ctx.fillRect(x,y,TW,10);       // top
  ctx.fillStyle='#4c4564'; ctx.fillRect(x,y+10,TW,16);    // face
  ctx.fillStyle='#332d49'; ctx.fillRect(x,y+26,TW,5);     // shadow
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(x+hash(r,c,1)*40,y+2,12,2);
  ctx.strokeStyle='#332d49'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+0.5,y); ctx.lineTo(x+0.5,y+26); ctx.stroke();
}
function drawCracks(x,y){
  ctx.strokeStyle='#241f33'; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+10,y+1); ctx.lineTo(x+22,y+8); ctx.lineTo(x+18,y+16);
  ctx.moveTo(x+40,y+2); ctx.lineTo(x+34,y+12); ctx.lineTo(x+46,y+20);
  ctx.stroke();
}
function drawSpikes(x,y,ext){
  const h=42*ext;
  ctx.fillStyle='#b9c2cc';
  for(let i=0;i<4;i++){
    const sx=x+8+i*14;
    ctx.beginPath();
    ctx.moveTo(sx,y+2); ctx.lineTo(sx+5,y+2-h); ctx.lineTo(sx+10,y+2);
    ctx.fill();
  }
  ctx.fillStyle='#7d8691';
  for(let i=0;i<4;i++){ const sx=x+8+i*14; ctx.fillRect(sx,y-2,10,4); }
}
function drawPlate(x,y,down){
  const lift=down>0.5?0:5;
  ctx.fillStyle='#8d8468'; ctx.fillRect(x+10,y+2-lift,TW-20,8);
  ctx.fillStyle='#5e5743'; ctx.fillRect(x+10,y+6-lift,TW-20,4+lift);
}
function drawTorch(x,y){
  ctx.fillStyle='#5a4632'; ctx.fillRect(x-3,y,6,26);
  const t=performance.now()/90;
  const f1=6+Math.sin(t*1.3+x)*2, f2=10+Math.sin(t*1.9+x*2)*3;
  ctx.fillStyle='rgba(255,140,30,0.25)';
  ctx.beginPath(); ctx.arc(x,y-6,22+f1,0,7); ctx.fill();
  ctx.fillStyle='#ff9c2a';
  ctx.beginPath(); ctx.moveTo(x-6,y); ctx.quadraticCurveTo(x,y-14-f2,x+6,y); ctx.fill();
  ctx.fillStyle='#ffe08a';
  ctx.beginPath(); ctx.moveTo(x-3,y); ctx.quadraticCurveTo(x,y-7-f1*0.6,x+3,y); ctx.fill();
}
function drawBones(x,y){
  ctx.fillStyle='#cfc7b0';
  ctx.beginPath(); ctx.arc(x-14,y-8,7,0,7); ctx.fill();
  ctx.fillRect(x-6,y-6,26,4); ctx.fillRect(x+2,y-12,4,10);
  ctx.fillRect(x+10,y-10,4,8);
  ctx.fillStyle='#1b1726'; ctx.fillRect(x-17,y-10,3,3); ctx.fillRect(x-11,y-10,3,3);
}
function drawExit(x,floorY,open){
  // arched doorway, portcullis rises with open
  const w=76,h=150, top=floorY-h;
  ctx.fillStyle='#241f33'; // recess
  ctx.beginPath();
  ctx.moveTo(x-w/2,floorY); ctx.lineTo(x-w/2,top+30);
  ctx.quadraticCurveTo(x,top-22,x+w/2,top+30); ctx.lineTo(x+w/2,floorY); ctx.fill();
  ctx.strokeStyle='#6b6280'; ctx.lineWidth=6; ctx.stroke();
  // glow when open
  if(open>0.5){ ctx.fillStyle='rgba(255,230,150,'+(0.25*(open))+')';
    ctx.beginPath(); ctx.moveTo(x-w/2+6,floorY); ctx.lineTo(x-w/2+6,top+34);
    ctx.quadraticCurveTo(x,top-12,x+w/2-6,top+34); ctx.lineTo(x+w/2-6,floorY); ctx.fill(); }
  // portcullis
  const gh=(1-open)*(h-10);
  ctx.fillStyle='#7d8691';
  for(let i=-2;i<=2;i++) ctx.fillRect(x+i*14-3,floorY-gh,6,gh);
  if(gh>8){ctx.fillRect(x-w/2+6,floorY-gh,w-12,5);}
}
function drawGatesFront(r0,c0){
  for(const k of ['A','B']){
    const g=gates[k];
    if(g.r<r0||g.r>=r0+3||g.c<c0||g.c>=c0+10)continue;
    const x=g.c*TW, floorY=(g.r+1)*TH;
    const gh=(1-g.open)*(TH-12);
    ctx.fillStyle='#8a93a0';
    for(let i=0;i<4;i++)ctx.fillRect(x+12+i*12,floorY-gh,5,gh);
    if(gh>6){ctx.fillStyle='#5e6671';ctx.fillRect(x+8,floorY-gh,TW-16,6);
      ctx.fillRect(x+8,floorY-gh*0.5,TW-16,4);}
    // frame
    ctx.fillStyle='#332d49';
    ctx.fillRect(x+4,floorY-TH,6,TH); ctx.fillRect(x+TW-10,floorY-TH,6,TH);
  }
}
function drawItems(r0,c0){
  for(const it of items){
    if(it.taken)continue;
    if(it.r<r0||it.r>=r0+3||it.c<c0||it.c>=c0+10)continue;
    const x=it.c*TW+32, y=(it.r+1)*TH;
    if(it.type==='potion'){
      ctx.fillStyle='#27c2c8';
      ctx.fillRect(x-3,y-22,6,8);
      ctx.beginPath(); ctx.arc(x,y-8,9,0,7); ctx.fill();
      ctx.fillStyle='#e3475a';
      ctx.beginPath(); ctx.arc(x,y-7,6.5,0,7); ctx.fill();
      const b=Math.sin(performance.now()/200)*1.5;
      ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(x-1,y-13+b,2,2);
    } else { // sword on ground
      const g=0.5+0.5*Math.sin(performance.now()/300);
      ctx.save(); ctx.translate(x,y-4); ctx.rotate(-0.12);
      ctx.fillStyle='#c9d4de'; ctx.fillRect(-26,-2,44,4);
      ctx.fillStyle='#8a6d3a'; ctx.fillRect(18,-4,10,8); ctx.fillRect(14,-7,4,14);
      ctx.fillStyle='rgba(255,255,255,'+(0.5*g)+')'; ctx.fillRect(-20,-1,18,2);
      ctx.restore();
    }
  }
}
function drawDebris(){
  ctx.fillStyle='#4c4564';
  for(const d of debris){ if(d.life>0){
    ctx.fillRect(d.x+4,d.y,TW-8,16);
    ctx.fillStyle='#332d49'; ctx.fillRect(d.x+10,d.y+10,TW-30,6); ctx.fillStyle='#4c4564';
  }}
}

// ----- characters (jointed figures) -----
function pt(x,y,a,l){ return [x+Math.sin(a)*l, y+Math.cos(a)*l]; }
function stroke2(x1,y1,x2,y2,w,col){
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}
// two-segment limb; angles measured from straight-down, + = forward
function limb2(x,y,a1,l1,a2,l2,w,col){
  const [kx,ky]=pt(x,y,a1,l1), [ex,ey]=pt(kx,ky,a2,l2);
  stroke2(x,y,kx,ky,w,col); stroke2(kx,ky,ex,ey,w-1,col);
  return [ex,ey,kx,ky];
}
function drawFigure(x,y,face,anim,ph,o){
  // y = feet. o={skin,tunic,shade,pants,hair,foot,helmet,trim}
  ctx.save(); ctx.translate(x,y); ctx.scale(face,1);
  const now=performance.now();
  const t=ph*Math.PI*2;
  // pose: [thigh,shin] per leg; [upper,fore] per arm (absolute angles)
  let hip=-50, lean=0, bob=0, sword=null, swordLen=44;
  let lf=[0.06,0.02], lb=[-0.06,-0.1];        // legs front/back
  let af=[0.15,0.35], ab=[-0.15,-0.35];       // arms front/back
  switch(anim){
    case 'run':{
      const s1=Math.sin(t), s2=Math.sin(t+Math.PI);
      lf=[0.85*s1, 0.85*s1-(0.35+0.8*Math.max(0,Math.cos(t)))];
      lb=[0.85*s2, 0.85*s2-(0.35+0.8*Math.max(0,Math.cos(t+Math.PI)))];
      af=[0.8*s2, 0.8*s2+0.9]; ab=[0.8*s1, 0.8*s1+0.9];
      lean=0.22; bob=Math.abs(Math.sin(t))*2.5; break;}
    case 'walk':{
      const s1=Math.sin(t), s2=Math.sin(t+Math.PI);
      lf=[0.35*s1,0.35*s1-0.15]; lb=[0.35*s2,0.35*s2-0.15];
      af=[0.45,0.85]; ab=[0.2,0.5]; lean=0.05; break;}
    case 'leap': lf=[1.15,1.0]; lb=[-1.0,-1.9]; af=[-0.9,-1.3]; ab=[0.9,1.3];
                 lean=0.3; bob=3; break;
    case 'jumpup': lf=[0.35,-0.5]; lb=[-0.2,-0.7]; af=[3.0,3.1]; ab=[2.9,3.0]; break;
    case 'fall': lf=[0.5,0.2]; lb=[-0.4,-0.8];
                 af=[2.5+0.2*Math.sin(now/80),2.8]; ab=[-2.4,-2.6]; break;
    case 'crouch': hip=-28; lf=[1.5,-0.4]; lb=[-1.2,-2.4]; af=[0.7,1.5]; ab=[0.4,1.1];
                   lean=0.5; break;
    case 'hang': hip=-46; lf=[0.18,0.05]; lb=[-0.12,-0.28];
                 af=[2.85,3.05]; ab=[2.75,2.95]; break;
    case 'climb':{ const e=Math.min(1,ph); // ph = progress
      hip=-28-22*e; lf=[1.4-1.3*e,-0.4+0.4*e]; lb=[-1.1+1.0*e,-2.2+2.1*e];
      af=[2.8-2.6*e,3.0-2.6*e]; ab=[1.2-1.0*e,1.6-1.2*e]; lean=0.4-0.4*e; break;}
    case 'stance': hip=-46; lf=[0.55,0.3]; lb=[-0.55,-0.95];
                   af=[1.25,2.05]; ab=[-0.7,-1.4]; sword=-0.35; break;
    case 'strike': hip=-44; lf=[1.05,0.75]; lb=[-0.85,-0.9];
                   af=[1.55,1.62]; ab=[-0.9,-1.5]; sword=0.12; swordLen=50; lean=0.35; break;
    case 'parry': hip=-48; lf=[0.3,0.1]; lb=[-0.3,-0.5];
                  af=[0.9,0.2]; ab=[-0.5,-1.0]; sword=-1.35; lean=-0.08; break;
    case 'dead':{
      ctx.fillStyle=o.tunic; ctx.fillRect(-28,-11,46,9);
      ctx.fillStyle=o.pants; ctx.fillRect(14,-9,18,6);
      ctx.fillStyle=o.skin; ctx.beginPath(); ctx.arc(-33,-8,7.5,0,7); ctx.fill();
      if(o.helmet){ ctx.fillStyle=o.hair; ctx.beginPath(); ctx.arc(-34,-10,7,Math.PI,2*Math.PI); ctx.fill(); }
      else { ctx.fillStyle=o.hair; ctx.beginPath(); ctx.arc(-35,-11,6.5,2.6,6.5); ctx.fill(); }
      stroke2(-8,-8,-20,-3,4,o.skin);
      ctx.restore(); return;}
  }
  hip-=bob;
  const sh=hip-26;               // shoulder height
  const neck=sh-4, headY=sh-13;
  // --- back arm ---
  const bHand=limb2(2,sh,ab[0],17,ab[1],15,4.5,o.shade);
  // --- back leg (pants) ---
  const bFoot=limb2(0,hip,lb[0],24,lb[1],21,6,o.shade);
  drawFoot(bFoot[0],bFoot[1],o,true);
  // --- torso & tunic ---
  ctx.save(); ctx.translate(0,hip); ctx.rotate(lean*0.5);
  ctx.fillStyle=o.tunic;
  ctx.beginPath();                       // tunic body
  ctx.moveTo(-8,2); ctx.lineTo(8,2); ctx.lineTo(7,hip>-40?-14:-22);
  ctx.lineTo(6,sh-hip-2); ctx.lineTo(-6,sh-hip-2); ctx.lineTo(-7,-14); ctx.fill();
  // skirt flare
  ctx.beginPath(); ctx.moveTo(-8,-2); ctx.lineTo(8,-2);
  ctx.lineTo(11,12); ctx.lineTo(-11,12); ctx.fill();
  ctx.fillStyle=o.shade; ctx.fillRect(-8,-2,4,13);   // skirt shading
  if(o.trim){ ctx.fillStyle=o.trim; ctx.fillRect(-8,0,16,3); } // sash
  ctx.restore();
  // --- head ---
  ctx.fillStyle=o.skin; ctx.beginPath(); ctx.arc(2,headY,8,0,7); ctx.fill();
  ctx.fillRect(6,headY+1,4,3);                        // nose hint (profile)
  if(o.helmet){
    ctx.fillStyle=o.hair;
    ctx.beginPath(); ctx.arc(2,headY-1,9,Math.PI,2*Math.PI); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4,headY-9); ctx.lineTo(2,headY-17); ctx.lineTo(8,headY-9); ctx.fill();
    ctx.fillRect(-7,headY-2,18,3);
  } else {
    ctx.fillStyle=o.hair;                              // blond mop, covers back of head
    ctx.beginPath(); ctx.arc(0,headY-2,8.5,Math.PI*0.75,Math.PI*2.1); ctx.fill();
    ctx.beginPath(); ctx.arc(-5,headY+2,4.5,0,7); ctx.fill();
  }
  // --- front leg (pants) ---
  const fFoot=limb2(0,hip,lf[0],24,lf[1],21,6,o.pants);
  drawFoot(fFoot[0],fFoot[1],o,false);
  // --- front arm (+ sword) ---
  const fHand=limb2(2,sh,af[0],17,af[1],15,4.5,o.skin);
  if(sword!==null){
    ctx.save(); ctx.translate(fHand[0],fHand[1]); ctx.rotate(sword);
    ctx.fillStyle='#d6dee6'; ctx.fillRect(2,-1.7,swordLen,3.4);
    ctx.fillStyle='#eef4f8'; ctx.fillRect(2,-1.7,swordLen,1.4);
    ctx.fillStyle='#8a6d3a'; ctx.fillRect(0,-5,3,10);
    ctx.restore();
  } else if(anim==='hang'){
    ctx.fillStyle=o.skin;                              // gripping fingers
    ctx.fillRect(fHand[0]-3,fHand[1]-3,6,4); ctx.fillRect(bHand[0]-3,bHand[1]-3,6,4);
  }
  ctx.restore();
}
function drawFoot(fx,fy,o,back){
  ctx.fillStyle = o.foot==='skin' ? o.skin : o.foot;
  ctx.fillRect(fx-2,fy-3,11,4);
}
function drawPrince(){
  let anim=P.anim;
  if(P.act==='pickup'||P.act==='drink')anim='crouch';
  if(P.mode==='hang')anim='hang';
  let ph=P.ph;
  if(P.mode==='climb'&&P.climb){ anim='climb'; ph=P.climb.t; }
  drawFigure(P.x,P.y,P.face,anim,ph,{
    skin:'#e0aa78', tunic:'#f0f0ee', shade:'#c4c4c2', pants:'#e6e6e3',
    hair:'#e8c447', foot:'skin', helmet:false, trim:null});
  if(P.iframes>0&&(P.iframes%6<3)){
    ctx.fillStyle='rgba(255,60,60,0.15)';
    ctx.fillRect(P.x-20,P.y-100,40,100);
  }
}
function drawGuard(){
  let anim='stance';
  if(!guard.alive)anim='dead';
  else if(guard.strikeT>10&&guard.strikeT<=20)anim='strike';
  else if(guard.strikeT>20)anim='parry';
  drawFigure(guard.x,guard.y,guard.face,anim,0,{
    skin:'#c98f5a', tunic:'#9a4050', shade:'#6e2e3a', pants:'#4a4258',
    hair:'#aab3bd', foot:'#3a3340', helmet:true, trim:'#caa44a'});
  if(guard.alive&&guard.strikeT>20){
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(guard.x-22,guard.y-104,44,104);
  }
}

// ----- HUD & screens -----
function tri(x,y,full,col){
  ctx.fillStyle=full?col:'#3a3450';
  ctx.beginPath(); ctx.moveTo(x,y+14); ctx.lineTo(x+7,y); ctx.lineTo(x+14,y+14); ctx.fill();
}
function drawHUD(){
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,VIEW_H,cv.width,HUD_H);
  ctx.fillStyle='#241f33'; ctx.fillRect(0,VIEW_H,cv.width,3);
  for(let i=0;i<P.maxhp;i++) tri(12+i*20, VIEW_H+12, i<P.hp, '#e3475a');
  if(combatActive()&&guard.alive)
    for(let i=0;i<3;i++) tri(cv.width-26-i*20, VIEW_H+12, i<guard.hp, '#27c2c8');
  // timer
  const s=Math.max(0,Math.ceil(timeLeft/1000));
  const mm=Math.floor(s/60), ss=s%60;
  ctx.fillStyle='#cfc7b0'; ctx.font='16px monospace'; ctx.textAlign='center';
  ctx.fillText(mm+':'+String(ss).padStart(2,'0'), cv.width/2, VIEW_H+22);
  if(msgT>0){ ctx.fillStyle='#ffe08a'; ctx.font='14px monospace';
    ctx.fillText(msg, cv.width/2, VIEW_H+44); }
  ctx.textAlign='left';
}
function goldDiamond(x,y,s,col){
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x+s,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s,y); ctx.fill();
}
function titleMotif(x,y){ // small gold trefoil ornament
  ctx.fillStyle='#b88a2c';
  ctx.fillRect(x-1,y-5,2,10); ctx.fillRect(x-5,y-1,10,2);
  ctx.fillRect(x-3,y-3,2,2); ctx.fillRect(x+1,y-3,2,2);
  ctx.fillRect(x-3,y+1,2,2); ctx.fillRect(x+1,y+1,2,2);
}
function drawTitle(){
  const W=cv.width,H=cv.height;
  // ----- carpet border -----
  ctx.fillStyle='#641a24'; ctx.fillRect(0,0,W,H);                 // outer band
  for(let x=14;x<W;x+=28){ goldDiamond(x,9,5,'#d8a93a'); goldDiamond(x,H-9,5,'#d8a93a'); }
  for(let y=28;y<H-14;y+=28){ goldDiamond(9,y,5,'#d8a93a'); goldDiamond(W-9,y,5,'#d8a93a'); }
  ctx.strokeStyle='#d8a93a'; ctx.lineWidth=3; ctx.strokeRect(19.5,19.5,W-39,H-39);
  // blue mosaic inner band
  for(let x=24;x<W-32;x+=12){
    ctx.fillStyle='#27407e'; ctx.fillRect(x,24,10,10); ctx.fillRect(x,H-34,10,10);
    ctx.fillStyle='#4a6cc4'; ctx.fillRect(x+2,26,4,4);  ctx.fillRect(x+2,H-32,4,4);
  }
  for(let y=36;y<H-44;y+=12){
    ctx.fillStyle='#27407e'; ctx.fillRect(24,y,10,10); ctx.fillRect(W-34,y,10,10);
    ctx.fillStyle='#4a6cc4'; ctx.fillRect(26,y+2,4,4); ctx.fillRect(W-32,y+2,4,4);
  }
  // ----- central panel -----
  ctx.fillStyle='#1c1240'; ctx.fillRect(36,36,W-72,H-72);
  [[80,80],[560,80],[64,170],[576,170],[90,260],[550,260],[120,120],[520,120]]
    .forEach(([x,y])=>titleMotif(x,y));
  // ----- ogee arch window -----
  const bx=320, baseY=272, L=185, R=455;
  const arch=()=>{ ctx.beginPath();
    ctx.moveTo(L,baseY); ctx.lineTo(L,150);
    ctx.bezierCurveTo(L,92, 270,118, bx,40);
    ctx.bezierCurveTo(370,118, R,92, R,150);
    ctx.lineTo(R,baseY); ctx.closePath(); };
  arch(); ctx.strokeStyle='#d8a93a'; ctx.lineWidth=12; ctx.lineJoin='round'; ctx.stroke();
  arch(); ctx.strokeStyle='#8a5f1c'; ctx.lineWidth=4; ctx.stroke();
  ctx.save(); arch(); ctx.clip();
  // night sky
  ctx.fillStyle='#150c34'; ctx.fillRect(L,30,R-L,baseY-30);
  for(let i=0;i<60;i++){
    const sx=L+hash(i,3,1)*(R-L), sy=38+hash(i,7,2)*150;
    ctx.fillStyle=hash(i,5,3)>0.5?'#f2ead0':'#d8a93a';
    ctx.fillRect(sx,sy,2,2);
  }
  for(const[sx,sy]of[[230,70],[402,58],[290,52],[430,130]]){ // sparkle crosses
    ctx.fillStyle='#f2ead0';
    ctx.fillRect(sx-1,sy-5,2,10); ctx.fillRect(sx-5,sy-1,10,2);
  }
  // hill
  ctx.fillStyle='#34204e';
  ctx.beginPath(); ctx.moveTo(L,baseY); ctx.lineTo(L,232);
  ctx.quadraticCurveTo(250,214,320,222); ctx.quadraticCurveTo(400,228,R,218);
  ctx.lineTo(R,baseY); ctx.fill();
  ctx.fillStyle='#241536';
  for(let i=0;i<8;i++){ const rx=L+10+hash(i,11,4)*(R-L-40);
    ctx.beginPath(); ctx.arc(rx,baseY-6-hash(i,13,5)*16,14+hash(i,17,6)*12,0,7); ctx.fill(); }
  // palace
  ctx.fillStyle='#b07f24'; ctx.fillRect(252,186,136,38);          // wall
  ctx.fillStyle='#8a5f1c'; ctx.fillRect(252,218,136,6);
  ctx.fillStyle='#caa036';                                        // minarets
  for(const[mx,mh]of[[240,82],[262,66],[362,66],[386,82]]){
    ctx.fillRect(mx,222-mh,9,mh);
    ctx.beginPath(); ctx.arc(mx+4.5,222-mh,6,Math.PI,2*Math.PI); ctx.fill();
    ctx.fillStyle='#3a2350'; ctx.fillRect(mx+3,222-mh+14,3,5); ctx.fillStyle='#caa036';
  }
  ctx.fillStyle='#d8a93a';                                        // side domes
  ctx.beginPath(); ctx.arc(288,186,13,Math.PI,2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(352,186,13,Math.PI,2*Math.PI); ctx.fill();
  ctx.fillStyle='#caa036'; ctx.fillRect(300,158,40,28);           // drum
  ctx.fillStyle='#e8b83a';                                        // grand dome
  ctx.beginPath(); ctx.arc(320,158,25,Math.PI,2*Math.PI); ctx.fill();
  ctx.fillRect(319,124,2,10); ctx.fillRect(317,122,6,3);          // finial
  ctx.fillStyle='#2a1840';                                        // gate
  ctx.beginPath(); ctx.moveTo(310,224); ctx.lineTo(310,206);
  ctx.quadraticCurveTo(320,196,330,206); ctx.lineTo(330,224); ctx.fill();
  ctx.fillStyle='#ffd98a';                                        // lit windows
  for(const[wx,wy]of[[262,196],[276,202],[344,196],[358,202],[300,170],[336,170]])
    ctx.fillRect(wx,wy,3,5);
  ctx.strokeStyle='#1d1230'; ctx.lineWidth=3;                     // palm
  ctx.beginPath(); ctx.moveTo(428,224); ctx.quadraticCurveTo(432,200,428,192); ctx.stroke();
  ctx.lineWidth=2;
  for(const a of[-1.2,-0.6,0,0.6,1.2]){ ctx.beginPath(); ctx.moveTo(428,192);
    ctx.quadraticCurveTo(428+Math.sin(a)*16,184+Math.cos(a)*4-8,428+Math.sin(a)*24,188+Math.cos(a)*10-4); ctx.stroke(); }
  ctx.restore();
  // ----- title lettering -----
  ctx.textAlign='center'; ctx.lineJoin='round';
  ctx.font='bold 56px Georgia, "Times New Roman", serif';
  ctx.lineWidth=9; ctx.strokeStyle='#120a24';
  ctx.strokeText('PRINCE',320,322); ctx.fillStyle='#f4f1ea'; ctx.fillText('PRINCE',320,322);
  ctx.font='italic bold 24px Georgia, serif';
  ctx.lineWidth=6; ctx.strokeText('of',320,348); ctx.fillStyle='#f4f1ea'; ctx.fillText('of',320,348);
  ctx.font='bold 56px Georgia, "Times New Roman", serif';
  ctx.lineWidth=9; ctx.strokeText('PERSIA',320,398); ctx.fillStyle='#f4f1ea'; ctx.fillText('PERSIA',320,398);
  if(Math.sin(performance.now()/300)>0){
    ctx.fillStyle='#ffd98a'; ctx.font='bold 15px monospace';
    ctx.fillText('PRESS ENTER TO BEGIN',320,419);
  }
  ctx.fillStyle='#b8a87a'; ctx.font='12px monospace';
  ctx.fillText('← → run · ↑ jump/climb/parry · ↓ crouch/pick up · SHIFT careful walk/grab/strike',320,433);
  ctx.textAlign='left';
}
function drawDeath(){
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,cv.width,VIEW_H);
  ctx.textAlign='center';
  ctx.fillStyle='#e3475a'; ctx.font='bold 26px monospace';
  ctx.fillText('You were '+deadReason+'.',cv.width/2,170);
  ctx.fillStyle='#cfc7b0'; ctx.font='15px monospace';
  ctx.fillText('The hourglass keeps draining...',cv.width/2,205);
  ctx.fillStyle='#ffe08a'; ctx.font='bold 16px monospace';
  if(Math.sin(performance.now()/300)>0)ctx.fillText('PRESS R TO TRY AGAIN',cv.width/2,250);
  ctx.textAlign='left';
}
function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textAlign='center';
  ctx.fillStyle='#e3475a'; ctx.font='bold 30px monospace';
  ctx.fillText('THE HOUR HAS PASSED',cv.width/2,180);
  ctx.fillStyle='#cfc7b0'; ctx.font='15px monospace';
  ctx.fillText('The princess is lost. The dungeon claims you.',cv.width/2,220);
  ctx.fillStyle='#ffe08a'; ctx.font='bold 16px monospace';
  ctx.fillText('PRESS R FOR THE TITLE SCREEN',cv.width/2,270);
  ctx.textAlign='left';
}
function drawWin(){
  const a=Math.min(1,winT/90);
  ctx.fillStyle='rgba(0,0,0,'+(0.75*a)+')'; ctx.fillRect(0,0,cv.width,cv.height);
  if(winT>40){
    ctx.textAlign='center';
    ctx.fillStyle='#ffe08a'; ctx.font='bold 30px monospace';
    ctx.fillText('YOU HAVE ESCAPED!',cv.width/2,160);
    const used=60*60*1000-timeLeft;
    const um=Math.floor(used/60000), us=Math.floor(used/1000)%60;
    ctx.fillStyle='#cfc7b0'; ctx.font='16px monospace';
    ctx.fillText('Time taken: '+um+':'+String(us).padStart(2,'0'),cv.width/2,200);
    ctx.fillText('The palace towers await... onward to the princess!',cv.width/2,232);
    ctx.fillStyle='#8a93a0'; ctx.font='14px monospace';
    if(winT>120&&Math.sin(performance.now()/300)>0)
      ctx.fillText('PRESS R FOR THE TITLE SCREEN',cv.width/2,290);
    ctx.textAlign='left';
  }
}

// ---------- boot ----------
gameState='title';
freshLevel(false);
timeLeft=60*60*1000;
// expose for testing
window.__game={get P(){return P;},get guard(){return guard;},get gates(){return gates;},
  keys, tick, startGame, get state(){return gameState;}, set state(s){gameState=s;},
  grid, get items(){return items;}, get timeLeft(){return timeLeft;}, render};
requestAnimationFrame(loop);
</script>
